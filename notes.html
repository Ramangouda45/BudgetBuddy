<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Thoughts - BudgetBuddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --accent-light: #f472b6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --white: #ffffff;
            --light-bg: #f8fafc;
            --light-bg-alt: #f1f5f9;
            --light-border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.15), 0 0 40px rgba(236, 72, 153, 0.1); }
            50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.25), 0 0 60px rgba(236, 72, 153, 0.15); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 25%, #f1f5f9 50%, #e0e7ff 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .notes-container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: 28px;
            box-shadow: var(--shadow-xl);
            border: 2px solid var(--light-border);
            padding: 40px;
            animation: fadeInUp 0.8s ease-out, glow 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .notes-header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease-out;
        }

        .notes-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: "Outfit", sans-serif;
            font-weight: 700;
        }

        .notes-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .notes-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-group textarea,
        .form-group input {
            padding: 14px;
            border-radius: 12px;
            border: 2px solid var(--light-border);
            background: var(--white);
            color: var(--text-dark);
            font-family: "Inter", system-ui, sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            resize: vertical;
        }

        .form-group input {
            min-height: 44px;
        }

        .form-group textarea {
            min-height: 200px;
            max-height: 400px;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: var(--white);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-submit,
        .btn-back {
            flex: 1;
            padding: 14px 20px;
            border-radius: 999px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: "Outfit", system-ui, sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            background-size: 200% 200%;
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
            background-position: 100% 0;
        }

        .btn-back {
            background: var(--light-bg);
            color: var(--text-dark);
            border: 2px solid var(--light-border);
        }

        .btn-back:hover {
            background: var(--light-bg-alt);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .saved-notes {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid var(--light-border);
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }

        .saved-notes h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-dark);
            font-family: "Outfit", sans-serif;
            font-weight: 700;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .note-item {
            background: linear-gradient(135deg, var(--light-bg), var(--white));
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.3s ease;
            animation: fade-in 0.5s ease-out;
            border: 2px solid var(--light-border);
            border-left-width: 4px;
        }

        .note-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-lg);
            border-left-color: var(--accent);
        }

        .note-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .note-title {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-family: "Outfit", sans-serif;
        }

        .note-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            word-break: break-word;
        }

        .note-date {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .delete-note-btn {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border: 2px solid #fca5a5;
            color: var(--danger);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-left: 12px;
            font-weight: 700;
        }

        .delete-note-btn:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .empty-notes {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .notes-container {
                padding: 24px;
            }

            .notes-header h1 {
                font-size: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="notes-container">
        <div class="notes-header">
            <h1>💭 Share Your Thoughts</h1>
            <p>Write notes about your expenses and spending habits</p>
        </div>

        <form id="notesForm" class="notes-form">
            <div class="form-group">
                <label for="noteTitle">Title</label>
                <input type="text" id="noteTitle" placeholder="e.g., My spending analysis" required>
            </div>
            <div class="form-group">
                <label for="noteContent">Your thoughts</label>
                <textarea id="noteContent" placeholder="Share your thoughts about your expenses..." required></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-submit">Save Note</button>
                <button type="button" class="btn-back" onclick="goBack()">Back to Home</button>
            </div>
        </form>

        <div class="saved-notes">
            <h2>Saved Notes</h2>
            <div id="notesList" class="notes-list">
                <div class="empty-notes">No notes saved yet. Create your first note above!</div>
            </div>
        </div>
    </div>

    <script>
        // Load and display saved notes
        function loadNotes() {
            const notes = JSON.parse(localStorage.getItem('expenseNotes')) || [];
            const notesList = document.getElementById('notesList');

            if (notes.length === 0) {
                notesList.innerHTML = '<div class="empty-notes">No notes saved yet. Create your first note above!</div>';
                return;
            }

            notesList.innerHTML = notes.map((note, index) => `
                <div class="note-item">
                    <div class="note-content">
                        <div class="note-title">${note.title}</div>
                        <div class="note-text">${note.content}</div>
                        <div class="note-date">${new Date(note.date).toLocaleDateString()} ${new Date(note.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                    <button type="button" class="delete-note-btn" onclick="deleteNote(${index})" title="Delete note">✕</button>
                </div>
            `).join('');
        }

        // Save new note
        document.getElementById('notesForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const notes = JSON.parse(localStorage.getItem('expenseNotes')) || [];

            notes.unshift({
                title: title,
                content: content,
                date: new Date().toISOString()
            });

            localStorage.setItem('expenseNotes', JSON.stringify(notes));
            this.reset();
            loadNotes();
            document.getElementById('noteTitle').focus();
        });

        // Delete note
        function deleteNote(index) {
            const notes = JSON.parse(localStorage.getItem('expenseNotes')) || [];
            notes.splice(index, 1);
            localStorage.setItem('expenseNotes', JSON.stringify(notes));
            loadNotes();
        }

        // Go back to home
        function goBack() {
            window.location.href = 'home.html';
        }

        // Load notes on page load
        loadNotes();
    </script>
</body>
</html>
