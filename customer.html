<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BudgetBuddy – Customers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #111827;
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.15);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --danger: #f97373;
            --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.45);
            --radius-xl: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0, #020617 50%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 24px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1120px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.9));
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(148, 163, 184, 0.18);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr);
        }

        .left-pane {
            padding: 28px 28px 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid rgba(148, 163, 184, 0.18);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo { display: flex; align-items: center; gap: 10px; }

        .logo-icon {
            width: 36px; height: 36px; border-radius: 14px;
            background: radial-gradient(circle at 20% 20%, #4ade80, #22c55e 45%, #16a34a);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #022c22;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.6);
        }

        .logo-text { font-weight: 600; letter-spacing: 0.03em; }

        .nav-links { display: flex; align-items: center; gap: 14px; font-size: 0.85rem; }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 999px;
            transition: 0.2s ease;
        }

        .nav-links a.active,
        .nav-links a:hover { color: #ecfeff; background: rgba(15, 118, 110, 0.35); }

        .hero-title { font-size: 1.9rem; line-height: 1.3; }
        .hero-title span { color: #4ade80; }
        .hero-subtitle { font-size: 0.92rem; color: var(--text-muted); max-width: 420px; }

        .form-card {
            background: rgba(15, 23, 42, 0.98);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

        label { font-size: 0.8rem; color: var(--text-muted); }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(17,24,39,0.75);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: rgba(34, 197, 94, 0.12); }
        textarea { min-height: 70px; resize: vertical; }

        .btn-primary {
            padding: 12px 18px;
            border-radius: 999px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: radial-gradient(circle at 10% 0, #4ade80, #22c55e 45%, #16a34a);
            color: #022c22;
            box-shadow: 0 12px 25px rgba(34, 197, 94, 0.55);
            width: 100%;
        }

        .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .summary-card { background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(148,163,184,0.25); border-radius: 16px; padding: 12px; }
        .summary-label { font-size: 0.75rem; color: var(--text-muted); }
        .summary-value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }

        .right-pane {
            padding: 24px;
            background: radial-gradient(circle at 0 0, rgba(34, 197, 94, 0.12), transparent 55%),
                        radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.12), transparent 55%);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card { background: rgba(15, 23, 42, 0.98); border-radius: var(--radius-xl); padding: 16px; border: 1px solid rgba(148,163,184,0.25); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .card-title { font-size: 0.95rem; font-weight: 600; }
        .card-subtitle { font-size: 0.78rem; color: var(--text-muted); }

        .customer-list { display: flex; flex-direction: column; gap: 10px; }
        .customer-item { padding: 12px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.2); background: rgba(17,24,39,0.75); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .customer-left { display: flex; flex-direction: column; gap: 6px; }
        .customer-name { font-weight: 600; }
        .customer-meta { font-size: 0.78rem; color: var(--text-muted); }
        .tag { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; border: 1px solid rgba(148,163,184,0.3); }
        .tag.gave { background: rgba(220, 38, 38, 0.15); color: #fecaca; border-color: rgba(220, 38, 38, 0.35); }
        .tag.got { background: rgba(34, 197, 94, 0.12); color: #bbf7d0; border-color: rgba(34, 197, 94, 0.35); }
        .amount { font-weight: 700; }
        .actions { display: flex; gap: 8px; }
        .btn-delete { padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(220,38,38,0.4); background: transparent; color: #fecaca; cursor: pointer; }

        .empty-state { text-align: center; padding: 28px; color: var(--text-muted); font-size: 0.9rem; }

        @media (max-width: 880px) {
            body { padding: 18px; }
            .app-wrapper { grid-template-columns: 1fr; }
            .left-pane { border-right: none; border-bottom: 1px solid rgba(148, 163, 184, 0.18); }
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card-header { flex-direction: column; align-items: flex-start; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="left-pane">
            <header class="nav">
                <div class="logo">
                    <div class="logo-icon">B</div>
                    <div class="logo-text">BudgetBuddy</div>
                </div>
                <div class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="bills.html">Bills</a>
                    <a href="customer.html" class="active">Customers</a>
                </div>
            </header>

            <div class="hero">
                <p class="hero-subtitle">Track what you gave and what you got from customers.</p>
                <h1 class="hero-title">Add and manage <span>customers</span></h1>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-label">Total customers</div>
                    <div class="summary-value" id="totalCustomers">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">You gave</div>
                    <div class="summary-value" id="totalGave">₹ 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">You got</div>
                    <div class="summary-value" id="totalGot">₹ 0</div>
                </div>
            </div>

            <div class="form-card">
                <form id="customerForm">
                    <div class="form-row">
                        <div>
                            <label>Customer Name</label>
                            <input type="text" id="customerName" placeholder="e.g., Rahul Sharma" required>
                        </div>
                        <div>
                            <label>Phone</label>
                            <input type="tel" id="customerPhone" placeholder="e.g., 9876543210">
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Amount</label>
                            <input type="number" id="customerAmount" placeholder="₹" required>
                        </div>
                        <div>
                            <label>Type</label>
                            <select id="customerType" required>
                                <option value="">Select</option>
                                <option value="gave">Gave</option>
                                <option value="got">You got</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Date</label>
                            <input type="date" id="customerDate" required>
                        </div>
                        <div>
                            <label>Notes</label>
                            <textarea id="customerNote" placeholder="Add a short note"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Add Customer Entry</button>
                </form>
            </div>
        </div>

        <div class="right-pane">
            <section class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Customer entries</div>
                        <div class="card-subtitle">You gave / You got</div>
                    </div>
                    <span class="badge-soft" id="customerCount">0</span>
                </div>
                <div class="customer-list" id="customerList">
                    <div class="empty-state">No customers yet. Add your first entry on the left.</div>
                </div>
            </section>
        </div>
    </div>

    <script src="customer.js"></script>
</body>
</html>
