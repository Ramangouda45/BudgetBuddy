<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=../home.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy - Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            margin: 10px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
    <script>
        // Redirect to home.html immediately if meta refresh doesn't work
        window.location.href = '../home.html';
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>BudgetBuddy</h2>
        <p>Redirecting to home page...</p>
    </div>
</body>
</html>
