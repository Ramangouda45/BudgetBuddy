<!DOCTYPE html>
// admin.html
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy – Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --white: #ffffff;
            --light-bg: #f8fafc;
            --light-card: #f1f5f9;
            --light-border: #e2e8f0;
            --bg-dark: #0f172a;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.2);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0), 0 0 40px rgba(99, 102, 241, 0); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3), 0 0 40px rgba(99, 102, 241, 0.1); }
            100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0), 0 0 40px rgba(99, 102, 241, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Outfit", "Inter", system-ui, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 25%, #f1f5f9 50%, #e0e7ff 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.12), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .admin-container {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--light-border);
            animation: fadeInUp 0.6s ease-out, glow 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.3rem;
            color: #0f172a;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 18px;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        #adminLoginForm .form-group:nth-child(1) { animation-delay: 0.5s; }
        #adminLoginForm .form-group:nth-child(2) { animation-delay: 0.6s; }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #0f172a;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--light-border);
            background: var(--light-bg);
            color: #0f172a;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .btn-admin {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-top: 8px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.7s both;
        }

        .btn-admin::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(99, 102, 241, 0.5);
        }

        .btn-admin:hover::before {
            left: 100%;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
            animation: fadeInUp 0.6s ease-out 0.8s both;
        }

        .bottom-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .bottom-text a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

        /* Admin Dashboard Styles */
        .admin-dashboard {
            display: none;
            width: 100%;
            max-width: 1000px;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .dashboard-header h1 {
            font-size: 2rem;
            color: #0f172a;
            font-family: "Outfit", sans-serif;
        }

        .logout-btn {
            padding: 10px 20px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--danger), #f97373);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        .dashboard-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--light-border);
        }

        .dashboard-title {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 24px;
            font-weight: 700;
        }

        #userList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: linear-gradient(135deg, var(--light-bg) 0%, var(--white) 100%);
            border: 2px solid var(--light-border);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .user-card h3 {
            color: #0f172a;
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .user-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .user-card strong {
            color: #0f172a;
            font-weight: 600;
        }

    </style>
</head>
<body>
    <div class="admin-container" id="adminLogin">
        <div class="logo">
            <div class="logo-icon">A</div>
            <div class="logo-text">Admin Panel</div>
        </div>
        <h2>Admin Login</h2>
        <p class="subtitle">Secure access for administrators only</p>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="adminUsername" placeholder="Enter admin username" required>
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn-admin">Admin Login</button>
        </form>
        <p class="bottom-text">
            <a href="login.html">← Back to User Login</a>
        </p>
    </div>

    <!-- Admin Dashboard Section -->
    <div class="admin-container admin-dashboard" id="adminDashboard">
        <div class="dashboard-header">
            <div>
                <h1>Welcome, Admin!</h1>
                <p style="color: #64748b; margin-top: 8px;">Manage and view all registered users</p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="home.html" class="logout-btn" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); text-decoration: none; display: inline-block;">Home</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="dashboard-container">
            <h2 class="dashboard-title">📋 Registered Users</h2>
            <div id="userList">
                <p style="color: #64748b; text-align: center; padding: 32px;">Loading users...</p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
