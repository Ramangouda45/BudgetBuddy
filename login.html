<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #ec4899;
            --success: #10b981;
            --white: #ffffff;
            --light-bg: #f8fafc;
            --light-card: #f1f5f9;
            --light-border: #e2e8f0;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.2);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0), 0 0 40px rgba(99, 102, 241, 0); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3), 0 0 40px rgba(99, 102, 241, 0.1); }
            100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0), 0 0 40px rgba(99, 102, 241, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slideRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }

        @keyframes slideLeft {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-30px); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Outfit", "Inter", system-ui, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #e0e7ff 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.05), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .money-bg { display: none; }

        /* Floating background shapes */
        .money-symbol {
            position: fixed;
            font-size: 2rem;
            font-weight: 600;
            color: rgba(99, 102, 241, 0.15);
            pointer-events: none;
            z-index: 0;
            font-family: 'Arial', sans-serif;
        }

        .money-1 {
            top: 10%;
            left: 10%;
            font-size: 3rem;
            color: rgba(99, 102, 241, 0.2);
            animation: float 8s ease-in-out infinite;
        }

        .money-2 {
            bottom: 15%;
            right: 10%;
            font-size: 2.5rem;
            color: rgba(16, 185, 129, 0.2);
            animation: floatReverse 10s ease-in-out infinite;
        }

        .money-3 {
            top: 60%;
            left: 15%;
            font-size: 2rem;
            color: rgba(236, 72, 153, 0.18);
            animation: float 12s ease-in-out infinite 2s;
        }

        .money-4 {
            top: 20%;
            right: 15%;
            font-size: 2.8rem;
            color: rgba(245, 158, 11, 0.2);
            animation: floatReverse 9s ease-in-out infinite 1s;
        }

        .money-5 {
            bottom: 25%;
            left: 25%;
            font-size: 2.2rem;
            color: rgba(59, 130, 246, 0.18);
            animation: pulse 6s ease-in-out infinite;
        }

        .money-6 {
            top: 40%;
            right: 25%;
            font-size: 2.6rem;
            color: rgba(147, 51, 234, 0.15);
            animation: float 10s ease-in-out infinite 3s;
        }

        .money-7 {
            bottom: 40%;
            left: 8%;
            font-size: 2.3rem;
            color: rgba(239, 68, 68, 0.18);
            animation: floatReverse 11s ease-in-out infinite 1.5s;
        }

        .money-8 {
            top: 70%;
            right: 30%;
            font-size: 2.4rem;
            color: rgba(16, 185, 129, 0.16);
            animation: float 9s ease-in-out infinite 2.5s;
        }

        .money-9 {
            top: 30%;
            left: 35%;
            font-size: 2.1rem;
            color: rgba(99, 102, 241, 0.12);
            animation: pulse 7s ease-in-out infinite 1s;
        }

        .money-10 {
            bottom: 30%;
            right: 8%;
            font-size: 2.7rem;
            color: rgba(245, 158, 11, 0.17);
            animation: floatReverse 8s ease-in-out infinite 2s;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--light-border);
            animation: fadeInUp 0.6s ease-out, glow 3s ease-in-out infinite;
            z-index: 1;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.3rem;
            color: #0f172a;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 18px;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        #loginForm .form-group:nth-child(1) { animation-delay: 0.5s; }
        #loginForm .form-group:nth-child(2) { animation-delay: 0.6s; }

        label {
            font-size: 0.9rem;
            color: #0f172a;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--light-border);
            background: var(--light-bg);
            color: #0f172a;
            font-family: inherit;
            font-size: 0.95rem;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .btn-login {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            animation: fadeInUp 0.6s ease-out 0.7s both;
        }

        .btn-login::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(99, 102, 241, 0.5);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
            animation: fadeInUp 0.6s ease-out 0.8s both;
        }

        .bottom-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .bottom-text a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <!-- Floating Money Symbols -->
    <div class="money-symbol money-1">₹</div>
    <div class="money-symbol money-2">$</div>
    <div class="money-symbol money-3">€</div>
    <div class="money-symbol money-4">£</div>
    <div class="money-symbol money-5">¥</div>
    <div class="money-symbol money-6">₹</div>
    <div class="money-symbol money-7">$</div>
    <div class="money-symbol money-8">€</div>
    <div class="money-symbol money-9">£</div>
    <div class="money-symbol money-10">¥</div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">B</div>
            <div class="logo-text">BudgetBuddy</div>
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue tracking your expenses</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <p class="bottom-text">
            Don't have an account? <a href="sign_up.html">Sign up</a> | <a href="admin.html">Admin</a> | <a href="home.html">Home</a>
        </p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }
    </script>
    <script src="login.js"></script>
</body>
</html>
