<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy – Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #111827;
            --green: #22c55e;
            --green-soft: rgba(34, 197, 94, 0.2);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --radius: 18px;
            --shadow: 0 20px 50px rgba(0,0,0,0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0, #020617 50%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(148,163,184,0.18);
            backdrop-filter: blur(16px);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: radial-gradient(circle at 20% 20%, #4ade80, #22c55e 50%, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #022c22;
            font-size: 20px;
            box-shadow: 0 12px 25px rgba(34,197,94,0.5);
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.3rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.45rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.87rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        /* Form */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid rgba(148,163,184,0.3);
            background: rgba(17,24,39,0.75);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: var(--green);
            background: rgba(34,197,94,0.12);
        }

        /* Signup button */
        .btn-signup {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            margin-top: 10px;
            border: none;
            background: radial-gradient(circle at 10% 0, #4ade80, #22c55e 45%, #16a34a);
            color: #022c22;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(34, 197, 94, 0.45);
            transition: 0.2s ease;
        }

        .btn-signup:hover { transform: translateY(-2px); }

        /* Footer link */
        .bottom-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .bottom-text a {
            color: var(--green);
            text-decoration: none;
        }

        .bottom-text a:hover { text-decoration: underline; }
    </style>
</head>

<body>

    <div class="signup-container">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">B</div>
            <div class="logo-text">BudgetBuddy</div>
        </div>

        <h2>Create Your Account</h2>
        <p class="subtitle">Start tracking and managing your expenses easily</p>

        <!-- Signup Form -->
        <form id="signupForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn-signup">Create Account</button>

        </form>

        <p class="bottom-text">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </div>

    <script src="signin.js"></script>

</body>
</html>
