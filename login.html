<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy – Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #111827;
            --green: #22c55e;
            --green-soft: rgba(34, 197, 94, 0.2);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --radius: 18px;
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0, #020617 50%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== Money Background ===== */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(34,197,94,0.12), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(34,197,94,0.1), transparent 45%);
            z-index: -2;
        }

        .money-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .money-bg span {
            position: absolute;
            font-size: 48px;
            color: rgba(34, 197, 94, 0.08);
            animation: floatMoney 18s linear infinite;
        }

        .money-bg span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .money-bg span:nth-child(2) { left: 30%; animation-delay: 4s; font-size: 60px; }
        .money-bg span:nth-child(3) { left: 55%; animation-delay: 8s; }
        .money-bg span:nth-child(4) { left: 75%; animation-delay: 12s; font-size: 54px; }
        .money-bg span:nth-child(5) { left: 90%; animation-delay: 6s; }

        @keyframes floatMoney {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-10vh) rotate(360deg); }
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(148,163,184,0.18);
            backdrop-filter: blur(16px);
            animation: fadeIn 0.6s ease;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: radial-gradient(circle at 20% 20%, #4ade80, #22c55e 50%, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #022c22;
            font-size: 20px;
            box-shadow: 0 12px 25px rgba(34,197,94,0.5);
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.3rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.45rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(17,24,39,0.75);
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--green);
            background: rgba(34,197,94,0.1);
            box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: none;
            background: radial-gradient(circle at 10% 0, #4ade80, #22c55e 45%, #16a34a);
            color: #022c22;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(34, 197, 94, 0.45);
        }

        .bottom-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .bottom-text a {
            color: var(--green);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Background Money Layer -->
    <div class="money-bg">
        <span>₹</span>
        <span>$</span>
        <span>€</span>
        <span>₹</span>
        <span>$</span>
    </div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">B</div>
            <div class="logo-text">BudgetBuddy</div>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue tracking your expenses</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="signin.html">Sign up</a> |
            <a href="admin.html">Admin Login</a> |
            <a href="home.html">Home</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
