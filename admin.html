<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy – Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #111827;
            --admin-color: #f97316;
            --admin-soft: rgba(249, 115, 22, 0.2);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --radius: 18px;
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0, #020617 50%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-container {
            width: 100%;
            max-width: 400px;
            background: rgba(17, 24, 39, 0.9);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(249, 115, 22, 0.3);
            backdrop-filter: blur(16px);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: radial-gradient(circle at 20% 20%, #fb923c, #f97316 50%, #ea580c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #431407;
            font-size: 20px;
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.5);
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.3rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.4rem;
            color: var(--admin-color);
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(17,24,39,0.75);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: var(--admin-color);
            background: rgba(249, 115, 22, 0.12);
        }

        .btn-admin {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            margin-top: 6px;
            border: none;
            background: radial-gradient(circle at 10% 0, #fb923c, #f97316 45%, #ea580c);
            color: #431407;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.45);
            transition: 0.2s ease;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
        }

        .bottom-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .bottom-text a {
            color: var(--admin-color);
            text-decoration: none;
            transition: 0.2s ease;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        #adminDashboard {
            display: none;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .user-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-card {
            background: rgba(17,24,39,0.75);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .user-card h3 {
            color: var(--admin-color);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .user-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 4px 0;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            border-radius: 999px;
            border: 1px solid var(--admin-color);
            background: transparent;
            color: var(--admin-color);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--admin-soft);
        }

    </style>
</head>
<body>

    <div class="admin-container" id="adminLogin">
        <div class="logo">
            <div class="logo-icon">A</div>
            <div class="logo-text">Admin Panel</div>
        </div>

        <h2>Admin Login</h2>
        <p class="subtitle">Secure access for administrators only</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="adminUsername" placeholder="Enter admin username" required>
            </div>

            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="btn-admin">Admin Login</button>
        </form>

        <p class="bottom-text">
            <a href="login.html">← Back to User Login</a>
        </p>
    </div>

    <div class="admin-container" id="adminDashboard">
        <div class="dashboard-header">
            <div class="logo">
                <div class="logo-icon">A</div>
                <div class="logo-text">Admin Dashboard</div>
            </div>
            <p class="subtitle">Manage registered users</p>
        </div>

        <div class="user-list" id="userList"></div>

        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <script src="admin.js"></script>

</body>
</html>
