<!DOCTYPE html>
// customer.html
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BudgetBuddy – Customers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --accent-light: #f472b6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --white: #ffffff;
            --light-bg: #f8fafc;
            --light-bg-alt: #f1f5f9;
            --light-border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.15), 0 0 40px rgba(236, 72, 153, 0.1); }
            50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.25), 0 0 60px rgba(236, 72, 153, 0.15); }
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 25%, #f1f5f9 50%, #e0e7ff 100%);
            background-attachment: fixed;
            position: relative;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1120px;
            background: var(--white);
            border-radius: 28px;
            box-shadow: var(--shadow-xl);
            border: 2px solid var(--light-border);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out, glow 3s ease-in-out infinite;
        }

        .left-pane {
            padding: 28px 28px 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 2px solid var(--light-border);
            animation: slideInLeft 0.8s ease-out;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeInUp 0.6s ease-out;
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 10px;
            font-family: "Outfit", sans-serif;
        }

        .logo-icon {
            width: 36px; 
            height: 36px; 
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 700; 
            font-size: 18px; 
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            animation: bounce-subtle 2s ease-in-out infinite;
        }

        .logo-text { 
            font-weight: 700; 
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            font-size: 0.85rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 999px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-links a.active,
        .nav-links a:hover { 
            color: white; 
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .hero {
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .hero-title { 
            font-size: 1.9rem; 
            line-height: 1.3;
            font-family: "Outfit", sans-serif;
            font-weight: 700;
        }

        .hero-title span { 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle { 
            font-size: 0.92rem; 
            color: var(--text-muted); 
            max-width: 420px;
            margin-bottom: 12px;
        }

        .summary-grid {
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
        }

        .form-card {
            background: var(--light-bg);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--light-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
            transition: all 0.3s ease;
        }

        .form-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .form-row { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 10px;
        }

        .summary-grid { 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 10px;
        }

        .summary-card { 
            background: linear-gradient(135deg, var(--white), var(--light-bg));
            border: 2px solid var(--light-border);
            border-radius: 16px; 
            padding: 14px;
            transition: all 0.3s ease;
            animation: fade-in 0.6s ease-out;
        }

        .summary-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .customer-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
        }

        .customer-item { 
            padding: 14px; 
            border-radius: 14px; 
            border: 2px solid var(--light-border);
            background: var(--light-bg);
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 10px;
            transition: all 0.3s ease;
            animation: fade-in 0.5s ease-out;
        }

        .customer-item:hover {
            border-color: var(--primary-light);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .customer-left { 
            display: flex; 
            flex-direction: column; 
            gap: 6px;
        }

        .customer-name { 
            font-weight: 600;
            color: var(--text-dark);
            font-family: "Outfit", sans-serif;
        }

        .customer-meta { 
            font-size: 0.78rem; 
            color: var(--text-muted);
        }

        .tag { 
            padding: 4px 10px; 
            border-radius: 999px; 
            font-size: 0.75rem;
            border: 2px solid;
            font-weight: 600;
        }

        .tag.gave { 
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: var(--danger);
            border-color: #fca5a5;
        }

        .tag.got { 
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--success);
            border-color: #6ee7b7;
        }

        .amount { 
            font-weight: 700;
            font-family: "Outfit", sans-serif;
            font-size: 1.1rem;
        }

        .actions { 
            display: flex; 
            gap: 8px;
        }

        .btn-delete { 
            padding: 6px 12px; 
            border-radius: 10px; 
            border: 2px solid var(--danger);
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: var(--danger);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .empty-state { 
            text-align: center; 
            padding: 32px; 
            color: var(--text-muted); 
            font-size: 0.9rem;
            animation: fade-in 0.6s ease-out;
       
            margin-top: 6px;
            color: var(--text-dark);
            font-family: "Outfit", sans-serif;
        }

        .right-pane {
            padding: 24px;
            background: linear-gradient(135deg, var(--light-bg) 0%, var(--white) 100%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: slideInRight 0.8s ease-out;
            position: relative;
        }

        .right-pane::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .card { 
            background: var(--white);
            border-radius: var(--radius-xl); 
            padding: 18px; 
            border: 2px solid var(--light-border);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.6s backwards;
            position: relative;
        }

        .card:hover {
            box-shadow: var(--shadow-xl);
            transform: translateY(-4px);
        }

        .card-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 14px;
        }

        .card-title { 
            font-size: 1rem; 
            font-weight: 700;
            color: var(--text-dark);
            font-family: "Outfit", sans-serif;
        }

        .card-subtitle { 
            font-size: 0.78rem; 
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge-soft {
            background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
            color: white;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
       
            outline: none;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea { min-height: 70px; resize: vertical; }

        .btn-primary {
            padding: 12px 24px;
            border-radius: 999px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            background-size: 200% 200%;
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: "Outfit", sans-serif;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
            background-position: 100% 0;
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-md);
            font-family: "Inter", sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            background: var(--white);
            transition: all 0.3s ease;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            font-family: "Outfit", sans-serif;
        }

        .form-row > div {
            display: flex;
            flex-direction: column;
        }

        .summary-label { 
            font-size: 0.75rem; 
            color: var(--text-muted);
            font-weight: 500;
        }

        .summary-value { 
            font-size: 1.4rem; 
            font-weight: 700;
            color: var(--primary);
            margin-top: 6px;
            font-family: "Outfit", sans-serif;
        }

        @media (max-width: 880px) {
            body { padding: 18px; }
            .app-wrapper { grid-template-columns: 1fr; }
            .left-pane { border-right: none; border-bottom: 2px solid var(--light-border); padding-bottom: 24px; }
            .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .app-wrapper { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .form-row { grid-template-columns: 1fr; }
            .hero-title { font-size: 1.6rem; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .nav-links { font-size: 0.75rem; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="left-pane">
            <header class="nav">
                <div class="logo">
                    <div class="logo-icon">B</div>
                    <div class="logo-text">BudgetBuddy</div>
                </div>
                <div class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="bills.html">Bills</a>
                    <a href="customer.html" class="active">Customers</a>
                </div>
            </header>

            <div class="hero">
                <p class="hero-subtitle">Track what you gave and what you got from customers.</p>
                <h1 class="hero-title">Add and manage <span>customers</span></h1>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-label">Total customers</div>
                    <div class="summary-value" id="totalCustomers">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">You gave</div>
                    <div class="summary-value" id="totalGave">₹ 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">You got</div>
                    <div class="summary-value" id="totalGot">₹ 0</div>
                </div>
            </div>

            <div class="form-card">
                <form id="customerForm">
                    <div class="form-row">
                        <div>
                            <label>Customer Name</label>
                            <input type="text" id="customerName" placeholder="e.g., Rahul Sharma" required>
                        </div>
                        <div>
                            <label>Phone</label>
                            <input type="tel" id="customerPhone" placeholder="e.g., 9876543210">
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Amount</label>
                            <input type="number" id="customerAmount" placeholder="₹" required>
                        </div>
                        <div>
                            <label>Type</label>
                            <select id="customerType" required>
                                <option value="">Select</option>
                                <option value="gave">Gave</option>
                                <option value="got">You got</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label>Date</label>
                            <input type="date" id="customerDate" required>
                        </div>
                        <div>
                            <label>Notes</label>
                            <textarea id="customerNote" placeholder="Add a short note"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Add Customer Entry</button>
                </form>
            </div>
        </div>

        <div class="right-pane">
            <section class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Customer entries</div>
                        <div class="card-subtitle">You gave / You got</div>
                    </div>
                    <span class="badge-soft" id="customerCount">0</span>
                </div>
                <div class="customer-list" id="customerList">
                    <div class="empty-state">No customers yet. Add your first entry on the left.</div>
                </div>
            </section>
        </div>
    </div>

    <script src="customer.js"></script>
</body>
</html>
